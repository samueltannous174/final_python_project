<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50">
      <nav class="bg-[#475569] flex justify-between items-center px-10 py-4 text-white">
  <h1 class="text-2xl font-semibold">CareClinic</h1>

  <div class="flex items-center gap-10 text-lg">
    <a href="/home" class="flex items-center gap-2  px-4 py-2 rounded-xl">
      Home
    </a>

    <a href="/appointments" class="flex items-center gap-2 ">
      Appointments
    </a>

    <a href="/doctors" class="flex items-center gap-2 ">
      Doctors
    </a>

    <a href="/history" class="flex items-center gap-2 ">
      History
    </a>
  </div>

  <div class="flex items-center gap-2 text-lg font-semibold">
    <a href="/logout" class="hover:underline">Logout</a>
  </div>
</nav>


  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-3xl border border-gray-200 bg-white shadow-xl p-8">

      <h1 class="text-center text-2xl font-semibold text-gray-800">Register</h1>
      <p class="mt-1 text-center text-gray-500">Join CareClinic to manage your practice</p>

      <form class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
          <input id="first_name" name="first_name" type="text" required
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none " />
        </div>

        <div>
          <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
          <input id="last_name" name="last_name" type="text" required
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none " />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input id="email" name="email" type="email" required
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none  " />
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
          <input id="phone" name="phone" type="tel"
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none  " />
        </div>

        <div>
          <label for="photo_url" class="block text-sm font-medium text-gray-700">Photo URL</label>
          <input id="photo_url" name="photo_url" type="url"
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none  " />
        </div>

        <div>
          <label for="certificate_url" class="block text-sm font-medium text-gray-700">Certificate URL</label>
          <input id="certificate_url" name="certificate_url" type="url"
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none " />
        </div>

        <div>
                      <label for="confirm" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" required
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none " />

        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input id="password" name="password" type="password" required
                 class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none " />
        </div>

        <div class="md:col-span-2">
                      <label for="specialization" class="block text-sm font-medium text-gray-700">Specialization</label>
          <select id="specialization" name="specialization"
                  class="mt-1 h-12 w-full border border-gray-300 bg-gray-50 px-4 text-gray-900 outline-none ">
            <option>A</option>
            <option>B</option>
            <option>C</option>
            <option>D</option>
            <option>E</option>
          </select>

        </div>

        <div class="md:col-span-2">
          <button type="submit"
                  class="mt-2 h-12 w-full bg-gray-900 text-white  ">
            Create Account
          </button>
        </div>
      </form>

      <div class="mt-4">
        <a href="/login" class="text-gray-600 underline">Sign in</a>
      </div>
    </div>
  </main>
</body>
</html>

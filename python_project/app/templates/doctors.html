<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctors Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-blue-50 text-gray-800">

  <nav class="bg-[#475569] flex justify-between items-center px-10 py-4 text-white">
    <h1 class="text-2xl font-semibold">CareClinic</h1>
    {% if user.role == 'patient' %}
    <div class="flex items-center gap-10 text-lg">
      <a href="/home" class="flex items-center gap-2 px-4 py-2 rounded-xl">Home</a>
      <a href="/doctors" class="flex items-center gap-2">Doctors</a>
      <a href="/history" class="flex items-center gap-2">History</a>
    </div>
    {% else %}
    <div class="flex items-center gap-10 text-lg">
      <a href="/home" class="flex items-center gap-2 px-4 py-2 rounded-xl">Home</a>
      <a href="/patients" class="flex items-center gap-2">Patients</a>
      <a href="/firstaid/voice" class="flex items-center gap-2">History</a>
    </div>
    {% endif %}
    <div class="flex items-center gap-20 text-lg font-semibold">
      <p class="text-amber-500">{{ user.first_name }}</p>
      {% if 'id' in request.session %}
      <a href="/logout" class="hover:underline">Logout</a>
      {% else %}
      <a href="/login" class="hover:underline">Login</a>
      {% endif %}
    </div>
  </nav>

  <div class="mx-auto max-w-7xl p-6">
    <form
      action="/filter_doctors/"
      method="post"
      class="flex items-center gap-3"
      hx-post="/filter_doctors/"
      hx-trigger="input delay:300ms, submit"
      hx-target="#doctor-grid"
      hx-swap="innerHTML"
    >
      {% csrf_token %}
      <div class="flex-1">
        <div class="relative">
          <input
            name="q"
            type="text"
            placeholder="Search doctors by name or specialty"
            value="{{ request.POST.q|default:'' }}"
            class="w-full rounded-full border border-gray-200 bg-white py-3 pl-4 pr-4 text-[15px] outline-none"
          />
        </div>
      </div>
    </form>

    <div id="doctor-grid" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      {% include "partials/_doctor_cards.html" with doctors=doctors %}
    </div>
  </div>

  <script>
    document.body.addEventListener("htmx:configRequest", (evt) => {
      const getCookie = (name) => {
        const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        return match ? decodeURIComponent(match[2]) : null;
      };
      const csrfToken = getCookie("csrftoken");
      if (csrfToken) evt.detail.headers["X-CSRFToken"] = csrfToken;
    });
  </script>
</body>
</html>
